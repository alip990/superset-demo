<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><title>اپلیکیشن میزبان — داشبورد تعبیه‌شده</title>
  <style>
    @font-face { font-family:Vazirmatn; src:url(/static/Vazirmatn-Regular.woff2) format("woff2"); font-display:swap; }
    body { font-family: Vazirmatn, Tahoma, sans-serif; margin: 0; background: #f4f5f7; }
    header { background: #1f2a44; color: #fff; padding: 12px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    select { font: inherit; padding: 4px 8px; }
    code { background: #0002; padding: 2px 6px; border-radius: 4px; direction: ltr; display: inline-block; }
    #dashboard { height: calc(100vh - 64px); min-height: 700px; }
    #loading { position:fixed; bottom:24px; left:24px; padding:16px; background:#1f2a44; color:white; border-radius:8px; z-index:99; }
    #error { color:#ffb4b4; }
    #dashboard iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
<header>
  <strong>اپلیکیشن ما</strong>
  <label>کاربر:
    <select id="user">
      <option value="{{ admin }}" {% if admin == current_user %}selected{% endif %}>مدیر سامانه (انتخاب مستقیم شرکت)</option>
      {% for u in users %}<option value="{{ u.username }}" {% if u.username == current_user %}selected{% endif %}>{{ u.username }} — {{ u.name }} ({{ u.company }})</option>{% endfor %}
    </select>
  </label>
  <label>شرکت:
    <select id="company">
      {% for c in companies %}<option value="{{ c.id }}" {% if c.id == current_company %}selected{% endif %}>{{ "— " * c.level }}{{ c.title }}</option>{% endfor %}
      {% if not companies %}<option value="">(این کاربر به هیچ شرکتی متصل نیست)</option>{% endif %}
    </select>
  </label>
  <span>allowed_companies: <code id="allowed">…</code></span>
  <span id="error" role="alert"></span>
</header>
<div id="loading" hidden>در حال بارگذاری داشبورد…</div>
<div id="dashboard"></div>
<script src="/static/embedded-sdk-0.3.0.js"></script>
<script>
  const el = id => document.getElementById(id);
  async function api(path, body) {
    const r = await fetch(path, body === undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'خطا در بارگذاری');
    return j;
  }
  async function fetchGuestToken() {
    const j = await api('/guest-token');
    el('allowed').textContent = j.allowed_companies || '—';
    return j.token;
  }
  let embedded;
  async function mount() {
    el('loading').hidden = false; el('error').textContent = '';
    let observer;
    const hideLoading = () => { el('loading').hidden = true; };
    const attachLoad = () => {
      const frame = el('dashboard').querySelector('iframe');
      if (!frame || frame.dataset.loadWatch) return !!frame;
      frame.dataset.loadWatch = '1';
      frame.addEventListener('load', hideLoading, {once: true});
      if (observer) observer.disconnect();
      return true;
    };
    try {
      if (embedded) embedded.unmount();
      el('dashboard').innerHTML = '';
      observer = new MutationObserver(attachLoad);
      observer.observe(el('dashboard'), {childList: true});
      embedded = await supersetEmbeddedSdk.embedDashboard({
        id: {{ dashboard_uuid | tojson }},
        supersetDomain: {{ superset_url | tojson }},
        mountPoint: el('dashboard'), fetchGuestToken,
        dashboardUiConfig: {hideTitle: false, filters: {visible: true, expanded: true}},
      });
      attachLoad();
    } catch (error) {
      el('error').textContent = error.message;
      hideLoading();
      if (observer) observer.disconnect();
    }
  }
  let actionQueue = Promise.resolve();
  function enqueue(task) {
    actionQueue = actionQueue.then(async () => {
      const controls = [...document.querySelectorAll('header select')];
      controls.forEach(control => { control.disabled = true; });
      try { await task(); }
      catch (error) { el('error').textContent = error.message; }
      finally { controls.forEach(control => { control.disabled = false; }); }
    });
    return actionQueue;
  }
  const userSel = el('user'), companySel = el('company');
  async function select(company) {
    await api('/login', {user: userSel.value, company: company || null});
    await mount();
  }
  userSel.onchange = () => enqueue(async () => {
    const j = await api('/companies?user=' + encodeURIComponent(userSel.value));
    companySel.innerHTML = j.companies.length
      ? j.companies.map(c => `<option value="${c.id}">${'— '.repeat(c.level)}${c.title}</option>`).join('')
      : '<option value="">(این کاربر به هیچ شرکتی متصل نیست)</option>';
    await select(companySel.value || null);
  });
  companySel.onchange = () => enqueue(() => select(companySel.value || null));
  actionQueue = mount();
</script>
</body>
</html>
