<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><title>اپلیکیشن میزبان — داشبورد تعبیه‌شده</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <style>
    body { font-family: Vazirmatn, Tahoma, sans-serif; margin: 0; background: #f4f5f7; }
    header { background: #1f2a44; color: #fff; padding: 12px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    select { font: inherit; padding: 4px 8px; }
    code { background: #0002; padding: 2px 6px; border-radius: 4px; direction: ltr; display: inline-block; }
    #dashboard { height: calc(100vh - 60px); }
    #dashboard iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
<header>
  <strong>اپلیکیشن ما</strong>
  <label>کاربر:
    <select id="user">
      <option value="{{ admin }}" {% if admin == current_user %}selected{% endif %}>مدیر سامانه (انتخاب مستقیم شرکت)</option>
      {% for u in users %}<option value="{{ u.username }}" {% if u.username == current_user %}selected{% endif %}>{{ u.username }} — {{ u.name }} ({{ u.company }})</option>{% endfor %}
    </select>
  </label>
  <label>شرکت:
    {# ids are strings: they exceed JavaScript's safe integer range #}
    <select id="company">
      {% for c in companies %}<option value="{{ c.id }}" {% if c.id == current_company %}selected{% endif %}>{{ "— " * c.level }}{{ c.title }}</option>{% endfor %}
      {% if not companies %}<option value="">(این کاربر به هیچ شرکتی متصل نیست)</option>{% endif %}
    </select>
  </label>
  <span>allowed_companies: <code id="allowed">…</code></span>
</header>
<div id="dashboard"></div>
<script src="https://cdn.jsdelivr.net/npm/@superset-ui/embedded-sdk@0.2.0/bundle/index.js"></script>
<script>
  async function fetchGuestToken() {
    const r = await fetch('/guest-token'); const j = await r.json();
    document.getElementById('allowed').textContent = j.allowed_companies;
    return j.token;
  }
  function mount() {
    document.getElementById('dashboard').innerHTML = '';
    supersetEmbeddedSdk.embedDashboard({
      id: "{{ dashboard_uuid }}",
      supersetDomain: "{{ superset_url }}",
      mountPoint: document.getElementById('dashboard'),
      fetchGuestToken,
      dashboardUiConfig: { hideTitle: false, filters: { expanded: false } },
    });
  }
  const userSel = document.getElementById('user'), companySel = document.getElementById('company');
  async function select(company) {
    await fetch('/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
                           body: JSON.stringify({user: userSel.value, company})});
    mount();
  }
  // new user: offer only the companies in their subtree, defaulting to their own company
  userSel.onchange = async () => {
    const r = await fetch('/companies?user=' + encodeURIComponent(userSel.value)); const j = await r.json();
    companySel.innerHTML = j.companies.length
      ? j.companies.map(c => `<option value="${c.id}">${'— '.repeat(c.level)}${c.title}</option>`).join('')
      : '<option value="">(این کاربر به هیچ شرکتی متصل نیست)</option>';
    select(companySel.value || null);
  };
  companySel.onchange = () => select(companySel.value || null);
  mount();
</script>
</body>
</html>
