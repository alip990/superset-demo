[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "superset-jalali-backend"
version = "1.1.0"
description = "Jalali backend configuration and pinned runtime adapters; no frontend replacement"
requires-python = ">=3.10"
license = "Apache-2.0"

[tool.setuptools.packages.find]
where = ["superset"]
include = ["jalali_calendar*"]
