name: Tests
on: [push, pull_request]
jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: docker compose config --quiet
      - run: python -m py_compile superset/*.py embed-app/*.py
