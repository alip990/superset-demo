name: Tests
on: [push, pull_request]
jobs:
  calendar-and-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e 'packages/superset-jalali-sql[dev]'
      - run: python packages/superset-jalali-sql/scripts/generate_nowruz.py
      - run: git diff --exit-code packages/superset-jalali-sql/src/superset_jalali_sql/nowruz.py
      - run: pytest packages/superset-jalali-sql/tests tests/test_host.py
