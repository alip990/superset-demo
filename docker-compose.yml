name: superset-demo

x-superset: &superset
  image: superset-demo:6.1.0-pg
  environment:
    SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    # No local tile server / iran.mbtiles available (ghcr.io was unreachable for
    # planetiler) - use OpenStreetMap's public raster tiles instead.
    MAP_TILE_URL: https://tile.openstreetmap.org/{z}/{x}/{y}.png
  volumes:
    - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    - ./superset/bootstrap.py:/app/bootstrap.py:ro
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_started}

services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    volumes:
      - ./db/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5440:5432"]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s, retries: 20}

  # restored copy of the 1 May beta backup (pg_dumpall, Postgres 14) - see backups/
  backup-db:
    image: postgres:14
    environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    volumes:
      - ./backups:/backups:ro
      - ./backups/restore.sh:/docker-entrypoint-initdb.d/01-restore.sh:ro
      - ./backups/02-bi.sql:/docker-entrypoint-initdb.d/02-bi.sql:ro
      - backupdata:/var/lib/postgresql/data
    ports: ["5441:5432"]
    # TCP check: during the first-start restore Postgres only listens on the unix socket,
    # so this stays unhealthy until the restore and BI build are done
    healthcheck: {test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"], interval: 10s, retries: 120}

  redis:
    image: redis:7-alpine

  superset-init:
    <<: *superset
    command: >
      bash -c "superset db upgrade &&
               superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password admin || true;
               superset init"

  superset:
    <<: *superset
    ports: ["8088:8088"]
    depends_on:
      superset-init: {condition: service_completed_successfully}
    healthcheck: {test: ["CMD", "curl", "-f", "http://localhost:8088/health"], interval: 10s, retries: 30}

  # creates DB connection, datasets, charts, dashboards, roles, users, RLS, embedding
  superset-bootstrap:
    <<: *superset
    command: bash -c "python /app/bootstrap.py && python /app/bootstrap_traffic.py"
    environment: {SUPERSET_URL: http://superset:8088, MAP_TILE_URL: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"}
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/bootstrap.py:/app/bootstrap.py:ro
      - ./superset/bootstrap_traffic.py:/app/bootstrap_traffic.py:ro
    depends_on:
      superset: {condition: service_healthy}
      backup-db: {condition: service_healthy}

  # host application that embeds a dashboard in an iframe using guest tokens
  embed-app:
    image: superset-demo:6.1.0-pg
    command: python /srv/app.py
    working_dir: /srv
    volumes: ["./embed-app:/srv:ro"]
    environment:
      SUPERSET_URL: http://superset:8088
      SUPERSET_PUBLIC_URL: http://localhost:8088
      EMBED_DASHBOARD_SLUG: traffic-fa-embedded
      # company tree used to compute allowed_companies for the guest token
      COMPANY_DB_URL: postgresql://bi_reader:bi_reader@backup-db:5432/CrimeManagementDb
    ports: ["8090:8090"]
    depends_on:
      superset: {condition: service_healthy}
      backup-db: {condition: service_healthy}

volumes:
  pgdata:
  backupdata:
