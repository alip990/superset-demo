name: superset-demo

x-superset: &superset
  image: superset-demo:6.1.0-pg
  environment:
    SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    TILE_SERVER_PUBLIC_URL: http://localhost:8081
  volumes:
    - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    - ./superset/bootstrap.py:/app/bootstrap.py:ro
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_started}

services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    volumes:
      - ./db/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5440:5432"]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s, retries: 20}

  redis:
    image: redis:7-alpine

  superset-init:
    <<: *superset
    command: >
      bash -c "superset db upgrade &&
               superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password admin || true;
               superset init"

  superset:
    <<: *superset
    ports: ["8088:8088"]
    depends_on:
      superset-init: {condition: service_completed_successfully}
    healthcheck: {test: ["CMD", "curl", "-f", "http://localhost:8088/health"], interval: 10s, retries: 30}

  # creates DB connection, datasets, charts, dashboards, roles, users, RLS, embedding
  superset-bootstrap:
    <<: *superset
    command: python /app/bootstrap.py
    environment: {SUPERSET_URL: http://superset:8088, TILE_SERVER_PUBLIC_URL: http://localhost:8081}
    depends_on:
      superset: {condition: service_healthy}

  # our own map server: vector tiles built from OSM (Iran extract) via planetiler
  tileserver:
    image: maptiler/tileserver-gl:v5.3.1
    command: ["--file", "/data/iran.mbtiles", "-p", "8080", "-u", "http://localhost:8081"]
    volumes: ["./tiles:/data"]
    ports: ["8081:8080"]

  # host application that embeds a dashboard in an iframe using guest tokens
  embed-app:
    image: superset-demo:6.1.0-pg
    command: python /srv/app.py
    working_dir: /srv
    volumes: ["./embed-app:/srv:ro"]
    environment: {SUPERSET_URL: http://superset:8088, SUPERSET_PUBLIC_URL: http://localhost:8088}
    ports: ["8090:8090"]
    depends_on:
      superset: {condition: service_healthy}

volumes:
  pgdata:
